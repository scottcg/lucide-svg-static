name: Release lucide-static-svg

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; defaults to v<crate version>"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package crate
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p lucide-static-svg
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucide-static-svg") | .version')"
          package="target/package/lucide-static-svg-${version}.crate"
          sha256="$(sha256sum "${package}" | cut -d' ' -f1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.package }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-v${VERSION}}"
          notes="lucide-static-svg ${VERSION}\n\nEmbedded Lucide catalog version: $(sed -n 's/^pub const LUCIDE_VERSION: &str = "\([^"]*\)";/\1/p' crates/lucide-static-svg/src/generated/version.rs)\n\nSHA-256 (${PACKAGE##*/}): ${SHA256}\n\nThis release is distributed as a GitHub release artifact. It is not published to crates.io."
          gh release create "${tag}" "${PACKAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "lucide-static-svg ${VERSION}" \
            --notes "${notes}"
