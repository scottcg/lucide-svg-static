name: Build and release lucide-static-svg

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Lucide release version; leave empty to use the latest release"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: lucide-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pull and verify Lucide release archive
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_VERSION}" ]]; then
            requested="${REQUESTED_VERSION#v}"
            release_json="$(gh api "repos/lucide-icons/lucide/releases/tags/${requested}")"
            force_release=true
          else
            release_json="$(gh api repos/lucide-icons/lucide/releases/latest)"
            force_release=false
          fi

          tag="$(jq -r '.tag_name' <<<"${release_json}")"
          version="${tag#v}"
          asset_name="lucide-icons-${version}.zip"
          asset="$(jq -c --arg name "${asset_name}" '.assets[] | select(.name == $name)' <<<"${release_json}")"

          if [[ -z "${asset}" ]]; then
            echo "Release ${tag} does not contain ${asset_name}" >&2
            exit 1
          fi

          asset_url="$(jq -r '.browser_download_url' <<<"${asset}")"
          expected_digest="$(jq -r '.digest // empty' <<<"${asset}")"
          archive="${RUNNER_TEMP}/${asset_name}"
          curl --fail --location --silent --show-error "${asset_url}" --output "${archive}"

          actual_digest="sha256:$(sha256sum "${archive}" | cut -d' ' -f1)"
          if [[ -n "${expected_digest}" && "${actual_digest}" != "${expected_digest}" ]]; then
            echo "Digest mismatch: expected ${expected_digest}, got ${actual_digest}" >&2
            exit 1
          fi

          current="$(sed -n 's/^pub const LUCIDE_VERSION: &str = "\([^"]*\)";/\1/p' crates/lucide-static-svg/src/generated/version.rs)"
          if [[ -z "${current}" ]]; then
            echo "Could not determine the embedded Lucide version" >&2
            exit 1
          fi

          if [[ "${force_release}" == false && "${current}" != "${version}" && "$(printf '%s\n' "${current}" "${version}" | sort -V | tail -n1)" == "${current}" ]]; then
            echo "Repository is already ahead of the reported upstream release; skipping downgrade."
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          release_tag="v${version}"
          release_exists=false
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_exists=true
            if [[ "${force_release}" == true ]]; then
              echo "GitHub Release ${release_tag} exists; manual run will refresh it."
              should_release=true
            else
              echo "GitHub Release ${release_tag} already exists; nothing to do."
              should_release=false
            fi
          else
            should_release=true
          fi

          echo "Upstream Lucide version: ${version}"
          echo "Embedded Lucide version: ${current}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"
          echo "release_exists=${release_exists}" >> "${GITHUB_OUTPUT}"

      - name: Generate catalog
        if: steps.upstream.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          cargo run -p xtask -- generate \
            --archive "${{ steps.upstream.outputs.archive }}" \
            --output crates/lucide-static-svg/src/generated \
            --tag "${VERSION}"
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml

      - name: Verify catalog
        if: steps.upstream.outputs.should_release == 'true'
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace --all-features
          cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Build downloadable crate
        if: steps.upstream.outputs.should_release == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p lucide-static-svg --allow-dirty
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucide-static-svg") | .version')"
          package="target/package/lucide-static-svg-${version}.crate"
          sha256="$(sha256sum "${package}" | cut -d' ' -f1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Commit generated catalog
        if: steps.upstream.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/lucide-static-svg/src/generated
          if git diff --cached --quiet; then
            echo "Generated catalog is already committed."
          else
            git commit -m "chore: update Lucide catalog to ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create GitHub Release
        if: steps.upstream.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LUCIDE_VERSION: ${{ steps.upstream.outputs.version }}
          CRATE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.package }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${LUCIDE_VERSION}"
          notes="$(printf 'lucide-static-svg %s\n\nEmbedded Lucide catalog version: %s\n\nSHA-256 (%s): %s\n\nThis release is a downloadable GitHub crate artifact. It is not published to crates.io.\n' \
            "${CRATE_VERSION}" \
            "${LUCIDE_VERSION}" \
            "${PACKAGE##*/}" \
            "${SHA256}")"
          if [[ "${{ steps.upstream.outputs.release_exists }}" == true ]]; then
            gh release upload "${release_tag}" "${PACKAGE}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "lucide-static-svg (Lucide ${LUCIDE_VERSION})" \
              --notes "${notes}"
          else
            gh release create "${release_tag}" "${PACKAGE}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$(git rev-parse HEAD)" \
              --title "lucide-static-svg (Lucide ${LUCIDE_VERSION})" \
              --notes "${notes}"
          fi
