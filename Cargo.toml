[workspace]
members = [
    "crates/lucide-static-svg",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "1.32.0"
edition = "2021"
license = "MIT AND ISC"
repository = "https://github.com/scottcg/lucide-svg-static"
homepage = "https://lucide.dev"
description = "Official Lucide icons as static SVG data for Rust"

[workspace.lints.rust]
unsafe_code = "forbid"
